name: Android Emulator Booking Test

on:
  workflow_dispatch:

jobs:
  emulator-booking-test:
    name: Booking flow on emulator (prod API)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls /dev/kvm

      - name: Get dependencies
        working-directory: android_flutter
        run: flutter pub get

      - name: Run booking flow test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          script: |
            cd android_flutter && flutter test integration_test/booking_flow_test.dart --no-pub
            EXIT=$?
            adb logcat -d -t 4000 > "$GITHUB_WORKSPACE/logcat.txt" 2>&1 || true
            exit $EXIT

      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: logcat.txt
          if-no-files-found: ignore

      - name: Surface result
        if: always()
        run: echo "::notice::emulator booking test finished"
