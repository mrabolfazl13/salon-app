name: Android Emulator Booking Test

on:
  workflow_dispatch:

jobs:
  emulator-booking-test:
    name: Booking flow + screens tour on emulator (prod API)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls /dev/kvm

      - name: Get dependencies
        working-directory: android_flutter
        run: flutter pub get

      - name: Run booking flow + screens tour on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          script: |
            cd android_flutter
            flutter pub get
            flutter test integration_test/booking_flow_test.dart
            BOOKING_EXIT=$?
            echo "booking test exit: $BOOKING_EXIT"
            TOUR_SHOTS_DIR="$GITHUB_WORKSPACE/tour-shots" flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/screens_tour_test.dart
            TOUR_EXIT=$?
            echo "tour exit: $TOUR_EXIT"
            adb logcat -d -t 4000 > "$GITHUB_WORKSPACE/logcat.txt" 2>&1 || true
            if [ "$BOOKING_EXIT" != "0" ] || [ "$TOUR_EXIT" != "0" ]; then exit 1; fi

      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: logcat.txt
          if-no-files-found: ignore

      - name: Upload tour screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-screenshots
          path: tour-shots/
          if-no-files-found: ignore

      - name: Surface result
        if: always()
        run: echo "::notice::emulator booking+tour finished"
