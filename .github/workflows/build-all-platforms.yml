name: Build All Platforms (Web + Tauri)

on:
  push:
    branches: [master, feat/mui-to-shadcn]
    tags:
      - 'v*'
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '22'

jobs:
  # NOTE: Flutter has been removed from this project's product paths entirely.
  # The Android product is Tauri Android (frontend/ + src-tauri), not Flutter.

  # ============================================
  # BACKEND (FastAPI) — همان ۸۰۰+ تستی که محلی اجرا میشود
  # ============================================
  backend-checks:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.4 pytest-asyncio==0.25.0
      - name: Run pytest
        run: python -m pytest -q

  # ============================================
  # TAURI BUILDS (Desktop + Mobile)
  # NOTE: Tauri project lives in frontend/ (package.json + src-tauri)
  # ============================================

  tauri-android:
    name: Tauri Android APK/AAB (Signed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            frontend/src-tauri/target/
          key: ${{ runner.os }}-tauri-android-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-tauri-android-cargo-

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Set NDK_HOME
        run: echo "NDK_HOME=$(ls -d ${ANDROID_HOME}/ndk/* | head -n 1)" >> $GITHUB_ENV

      - name: Init Android project
        working-directory: frontend
        run: pnpm tauri android init

      - name: Setup signing (key.properties + gradle init script)
        # gen/android is gitignored: `tauri android init` regenerates a template
        # WITHOUT any signing wiring on CI, so key.properties alone produced
        # app-universal-release-unsigned.apk (phones: "corrupted file").
        # A gradle init script wires the release signingConfig from
        # app/key.properties for any template version.
        working-directory: frontend/src-tauri/gen/android/app
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > release-keystore.jks
            cat > key.properties << EOF
          storeFile=release-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
            mkdir -p "$HOME/.gradle/init.d"
            cat > "$HOME/.gradle/init.d/tauri-signing.gradle" << 'GRADLE'
          gradle.allprojects { project ->
              def f = new File(project.projectDir, "key.properties")
              if (!f.exists()) return
              project.plugins.withId("com.android.application") {
                  def props = new Properties()
                  f.withInputStream { props.load(it) }
                  def sc = project.android.signingConfigs.findByName("release")
                  if (sc == null) sc = project.android.signingConfigs.create("release")
                  sc.storeFile = project.file(props.getProperty("storeFile"))
                  sc.storePassword = props.getProperty("storePassword")
                  sc.keyAlias = props.getProperty("keyAlias")
                  sc.keyPassword = props.getProperty("keyPassword")
                  def bt = project.android.buildTypes.findByName("release")
                  if (bt != null) bt.signingConfig = sc
              }
          }
          GRADLE
            echo "::notice::Tauri Android signing configured"
          else
            echo "::warning::KEYSTORE_BASE64 secret missing - building UNSIGNED APK/AAB"
          fi

      - name: Build APK + AAB
        working-directory: frontend
        # split-per-abi: موبایل‌ها فایل universal را «corrupted» می‌خوانند و آپدیت داخل
        # برنامه هم مسیر per-ABI را می‌خواهد؛ این حالت app-arm64-release.apk را واقعی می‌سازد.
        run: pnpm tauri android build --apk --aab --split-per-abi
        env:
          # اپ بومی به پروکسی هم‌مبدأ دسترسی ندارد؛ آدرس مطلق API لازم است.
          VITE_API_URL: ${{ secrets.TAURI_API_URL || 'http://salon.absadeghi.ir/api/v1' }}
          VITE_DOMAIN: ${{ secrets.TAURI_DOMAIN || 'http://salon.absadeghi.ir' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android.apk
          path: frontend/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android.aab
          path: frontend/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

  tauri-windows:
    name: Tauri Windows MSI/NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            frontend/src-tauri/target/
          key: ${{ runner.os }}-tauri-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-tauri-cargo-

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        working-directory: frontend
        run: pnpm tauri build
        env:
          VITE_API_URL: ${{ secrets.TAURI_API_URL || 'http://salon.absadeghi.ir/api/v1' }}
          VITE_DOMAIN: ${{ secrets.TAURI_DOMAIN || 'http://salon.absadeghi.ir' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe

  tauri-macos:
    name: Tauri macOS DMG (Intel + Apple Silicon)
    # macos-14 label isn't available on this repo's runner plan; build both
    # architectures by cross-compiling from the Intel macos-13 runner.
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build Apple Silicon DMG
        working-directory: frontend
        run: pnpm exec tauri build --target aarch64-apple-darwin
        env:
          VITE_API_URL: ${{ secrets.TAURI_API_URL || 'http://salon.absadeghi.ir/api/v1' }}
          VITE_DOMAIN: ${{ secrets.TAURI_DOMAIN || 'http://salon.absadeghi.ir' }}
      - name: Build Intel DMG
        working-directory: frontend
        run: pnpm exec tauri build --target x86_64-apple-darwin
        env:
          VITE_API_URL: ${{ secrets.TAURI_API_URL || 'http://salon.absadeghi.ir/api/v1' }}
          VITE_DOMAIN: ${{ secrets.TAURI_DOMAIN || 'http://salon.absadeghi.ir' }}
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-macos
          path: |
            frontend/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  tauri-linux:
    name: Tauri Linux DEB/AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget \
            file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build Tauri app
        working-directory: frontend
        run: pnpm exec tauri build
        env:
          VITE_API_URL: ${{ secrets.TAURI_API_URL || 'http://salon.absadeghi.ir/api/v1' }}
          VITE_DOMAIN: ${{ secrets.TAURI_DOMAIN || 'http://salon.absadeghi.ir' }}
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux
          path: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # ============================================
  # REACT WEB BUILD
  # ============================================

  react-web:
    name: React Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: pnpm exec tsc --noEmit -p tsconfig.app.json

      - name: Read the app version from package.json
        id: app-version
        working-directory: frontend
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build production bundle
        working-directory: frontend
        run: pnpm build
        env:
          # وب از همان دامنهٔ salon سرو می‌شود و nginx مسیر /api را پروکسی می‌کند؛
          # آدرس مطلق http روی صفحهٔ https به‌خاطر mixed-content بلاک می‌شود.
          VITE_API_URL: '/api/v1'
          VITE_DOMAIN: ''
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME || 'سالن من' }}
          # «نسخهٔ فعلی» در پروفایل باید با manifest یکی باشد، نه یک literal دستی که از نسخه جا می‌ماند
          VITE_APP_VERSION: ${{ secrets.VITE_APP_VERSION || steps.app-version.outputs.version }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-web-dist
          path: frontend/dist/

  # ============================================
  # RELEASE CREATION (Tags only)
  # ============================================

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - backend-checks
      - tauri-android
      - tauri-windows
      - tauri-macos
      - tauri-linux
      - react-web
    # Release only when every build/check succeeded; Web dist is bundled too.
    if: >-
      startsWith(github.ref, 'refs/tags/') && !cancelled() &&
      needs.backend-checks.result == 'success' &&
      needs.tauri-android.result == 'success' &&
      needs.tauri-windows.result == 'success' &&
      needs.tauri-macos.result == 'success' &&
      needs.tauri-linux.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          CHANGELOG=$(awk "/^## \\[$VERSION\\]/,/^## \\[/" CHANGELOG.md | head -n -1 || true)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.release_notes.outputs.version }}
          body: |
            ## What's Changed

            ${{ steps.release_notes.outputs.changelog }}

            ## Downloads

            ### 🤖 Tauri Android
            - **Android APK**: `tauri-android.apk/`
            - **Android AAB**: `tauri-android.aab/` (for Play Store)

            ### 💻 Tauri Desktop
            - **Windows MSI/EXE**: `tauri-windows/`
            - **macOS DMG (Intel + Apple Silicon)**: `tauri-macos/`
            - **Linux DEB/AppImage**: `tauri-linux/`

            ### 🌐 Web (React)
            - Production build: `react-web-dist/`
          files: |
            artifacts/tauri-android.apk/**
            artifacts/tauri-android.aab/**
            artifacts/tauri-windows/**
            artifacts/tauri-macos/**
            artifacts/tauri-linux/**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
