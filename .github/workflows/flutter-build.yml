name: Flutter Build APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
    paths:
      - 'pubspec.yaml'
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'frontend/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write
  issues: write

jobs:
  build-apk:
    name: Build Flutter Android release artifacts
    # ubuntu-latest migrates to Ubuntu 26 on 2026-10-19; the SDK packages and the GTK/webkit
    # dev packages used here were validated on 24.04, so the runner is pinned to it.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install Android SDK components
        run: |
          set -uo pipefail
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null || true
          # Must match android/app/build.gradle.kts (compileSdk 36, ndkVersion 27.0.12077973)
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          "$SDKMGR" --list_installed | grep -E "platforms;android-36|build-tools;36|ndk;27.0.12077973"

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret -> release APK/AAB stays debug-signed (documented limitation)."
            echo "signed=debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "android.injected.signing.store.file=$RUNNER_TEMP/release.keystore"
            echo "android.injected.signing.store.password=$KEYSTORE_PASSWORD"
            echo "android.injected.signing.key.alias=$KEY_ALIAS"
            echo "android.injected.signing.key.password=$KEY_PASSWORD"
          } >> android/gradle.properties
          echo "signed=release" >> "$GITHUB_OUTPUT"

      - name: Analyze project
        run: flutter analyze 2>&1 | tee /tmp/analyze.log

      - name: Run tests
        run: flutter test 2>&1 | tee /tmp/test.log

      - name: Build universal release APK
        run: flutter build apk --release 2>&1 | tee /tmp/apk-universal.log

      - name: Build per-ABI release APKs
        run: flutter build apk --release --split-per-abi 2>&1 | tee /tmp/apk-split.log

      - name: Build release AAB
        run: flutter build appbundle --release 2>&1 | tee /tmp/aab.log

      - name: Verify artifacts
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          DIR=build/app/outputs/flutter-apk
          "$BT/aapt2" dump badging "$DIR/app-release.apk" | grep -E "^package|^native-code" | tee /tmp/badging.txt
          grep -q "name='com.salon.futsal.futsal_booking_flutter'" /tmp/badging.txt
          grep -q "arm64-v8a" /tmp/badging.txt
          "$BT/apksigner" verify --print-certs "$DIR/app-release.apk" > /tmp/signer.txt
          cat /tmp/signer.txt
          grep -q "certificate DN:" /tmp/signer.txt
          # Each split APK must carry exactly one ABI and its own ABI-offset versionCode,
          # otherwise the per-ABI artifacts would be mislabelled copies of the universal one.
          for abi in arm64-v8a armeabi-v7a x86_64; do
            "$BT/aapt2" dump badging "$DIR/app-$abi-release.apk" > "/tmp/badging-$abi.txt"
            grep -q "^native-code: '$abi'\$" "/tmp/badging-$abi.txt"
            test "$(grep -c "^native-code:" "/tmp/badging-$abi.txt")" -eq 1
            grep -q "versionName='1.0.0'" "/tmp/badging-$abi.txt"
            "$BT/apksigner" verify "$DIR/app-$abi-release.apk"
          done
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          unzip -l "$AAB" | grep -E "base/manifest/AndroidManifest.xml|base/dex/classes.dex"
          ls -l "$DIR"/ "$AAB"
          # Actions log bodies are not reachable from every environment, but check-run
          # annotations are, so the verification evidence is published as one.
          SIGNER=$(sed -n 's/.*certificate DN: //p' /tmp/signer.txt | head -1)
          echo "::notice::verified universal $(stat -c %s "$DIR/app-release.apk")B + arm64 $(stat -c %s "$DIR/app-arm64-v8a-release.apk")B + armv7 $(stat -c %s "$DIR/app-armeabi-v7a-release.apk")B + x86_64 $(stat -c %s "$DIR/app-x86_64-release.apk")B + aab $(stat -c %s "$AAB")B, $SIGNER"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Report failure to an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Failing step logs (run ${{ github.run_id }}, attempt ${{ github.run_attempt }})"
            for f in /tmp/analyze.log /tmp/test.log /tmp/apk-universal.log /tmp/apk-split.log /tmp/aab.log; do
              if [ -s "$f" ]; then
                echo ""
                echo "### $f"
                echo '```'
                tail -n 120 "$f"
                echo '```'
              fi
            done
          } > /tmp/failure-report.md
          gh label create ci-build-failure --color ff6b6b --description "Automated CI build failure report" || true
          gh issue create \
            --title "CI Android build failed: ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}" \
            --label ci-build-failure \
            --body-file /tmp/failure-report.md
          echo "Build log tail:"
          tail -n 120 /tmp/apk-universal.log /tmp/apk-split.log /tmp/aab.log || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/*.log
          retention-days: 7

  build-windows:
    name: Build Windows desktop installers (Tauri)
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        # pnpm 12 is the major that generated pnpm-lock.yaml and understands the
        # allowBuilds/minimumReleaseAgeExclude keys in frontend/pnpm-workspace.yaml.
        run: npm install -g pnpm@12

      - name: Install dependencies
        working-directory: frontend
        # Logs live in the workspace, not /tmp: upload-artifact cannot resolve a Git Bash /tmp
        # path on a Windows runner, and it skips dot-directories unless asked not to, so a
        # failure log would be silently missing.
        run: |
          set -o pipefail
          mkdir -p ci-logs
          pnpm install --frozen-lockfile 2>&1 | tee ci-logs/pnpm-install.log

      - name: Build installers
        working-directory: frontend
        run: set -o pipefail; pnpm exec tauri build --bundles nsis,msi 2>&1 | tee ci-logs/tauri-windows.log

      - name: Verify artifacts
        run: |
          set -e
          BUNDLE=frontend/src-tauri/target/release/bundle
          fail() { echo "::error::$1"; exit 1; }
          ls -l "$BUNDLE"/nsis "$BUNDLE"/msi
          EXE=$(find "$BUNDLE"/nsis -name '*-setup.exe' -size +1M | head -1)
          MSI=$(find "$BUNDLE"/msi -name '*.msi' -size +1M | head -1)
          [ -n "$EXE" ] || fail "no >1M *-setup.exe under $BUNDLE/nsis"
          [ -n "$MSI" ] || fail "no >1M *.msi under $BUNDLE/msi"
          # The bundler also runs on a debug profile, so prove this was the release build.
          # cargo writes "Finished \`release\` profile ... in", so the word is delimited
          # by backticks rather than followed directly by "in".
          grep -qE "Finished .*release.* in" frontend/ci-logs/tauri-windows.log \
            || fail "no release-profile cargo line in tauri-windows.log"
          echo "::notice::verified nsis $(stat -c %s "$EXE")B + msi $(stat -c %s "$MSI")B"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.sha }}
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*-setup.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

      - name: Report failure reason
        if: failure()
        run: |
          for f in frontend/ci-logs/pnpm-install.log frontend/ci-logs/tauri-windows.log; do
            if [ -s "$f" ]; then
              echo "::error::$(basename "$f") tail: $(tail -c 900 "$f" | tr '\r\n' '  ')"
            fi
          done

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/ci-logs/*.log
          retention-days: 7

  build-linux:
    name: Build Linux packages (Tauri)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        # pnpm 12 is the major that generated pnpm-lock.yaml and understands the
        # allowBuilds/minimumReleaseAgeExclude keys in frontend/pnpm-workspace.yaml.
        run: npm install -g pnpm@12

      - name: Install dependencies
        working-directory: frontend
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee /tmp/pnpm-install.log

      - name: Build packages
        working-directory: frontend
        run: set -o pipefail; pnpm exec tauri build --bundles deb,appimage 2>&1 | tee /tmp/tauri-linux.log

      - name: Verify artifacts
        run: |
          set -e
          BUNDLE=frontend/src-tauri/target/release/bundle
          fail() { echo "::error::$1"; exit 1; }
          ls -l "$BUNDLE"/deb "$BUNDLE"/appimage
          DEB=$(find "$BUNDLE"/deb -name '*.deb' -size +1M | head -1)
          APP=$(find "$BUNDLE"/appimage -name '*.AppImage' -size +1M | head -1)
          [ -n "$DEB" ] || fail "no >1M *.deb under $BUNDLE/deb"
          [ -n "$APP" ] || fail "no >1M *.AppImage under $BUNDLE/appimage"
          # A .deb with no control metadata is not installable even though the file exists.
          dpkg-deb -f "$DEB" Package Version || fail "dpkg-deb cannot read $DEB"
          # cargo writes "Finished \`release\` profile ... in", so the word is delimited by
          # backticks rather than followed directly by "in".
          grep -qE "Finished .*release.* in" /tmp/tauri-linux.log \
            || fail "no release-profile cargo line in tauri-linux.log"
          echo "::notice::verified deb $(stat -c %s "$DEB")B + appimage $(stat -c %s "$APP")B"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-${{ github.sha }}
          path: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 30

      - name: Report failure reason
        if: failure()
        run: |
          for f in /tmp/pnpm-install.log /tmp/tauri-linux.log; do
            if [ -s "$f" ]; then
              echo "::error::$(basename "$f") tail: $(tail -c 900 "$f" | tr '\n' ' ')"
            fi
          done

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/*.log
          retention-days: 7

  build-ios:
    name: Build iOS release app (Flutter)
    # macos-latest so the preinstalled Xcode is at least as new as the toolchain the
    # Flutter 3.47.x engine was built against.
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # No Apple Developer certificate exists in this repository, so the device build is
      # published unsigned; it has to be re-signed before it installs on a phone.
      - name: Build device app (unsigned)
        run: set -o pipefail; flutter build ios --release --no-codesign 2>&1 | tee /tmp/ios-device.log

      - name: Verify artifacts
        run: |
          set -e
          DEV=build/ios/iphoneos/Runner.app
          {
            ls -l build/ios/ || true
            ls -l "$DEV" || true
            plutil -p "$DEV/Info.plist" || true
            file "$DEV/Runner" || true
            lipo -archs "$DEV/Runner" || true
          } > /tmp/ios-verify.log 2>&1
          fail() { echo "::error::$1"; exit 1; }
          test -s "$DEV/Info.plist" || fail "no $DEV/Info.plist: $(ls build/ios 2>&1 | tr '\n' ' ')"
          BID=$(plutil -extract CFBundleIdentifier raw -o - "$DEV/Info.plist")
          VER=$(plutil -extract CFBundleShortVersionString raw -o - "$DEV/Info.plist")
          KIND=$(file "$DEV/Runner")
          ARCHS=$(lipo -archs "$DEV/Runner")
          # The bundle must be an arm64 Mach-O: a simulator slice in its place would
          # match on filename and size.
          [ "$BID" = "com.salon.futsal.futsalBookingFlutter" ] || fail "unexpected bundle id '$BID'"
          [ "$VER" = "1.0.0" ] || fail "unexpected CFBundleShortVersionString '$VER'"
          [[ "$KIND" == *Mach-O* ]] || fail "'$DEV/Runner' is not a Mach-O binary: $KIND"
          [[ "$ARCHS" == *arm64* ]] || fail "'$DEV/Runner' has no arm64 slice: $ARCHS"
          echo "::notice::verified ios device $BID v$VER, $ARCHS, $(du -sk "$DEV" | cut -f1)KB"

      - name: Package apps
        run: |
          set -e
          NAME="${GITHUB_REF_NAME#v}"
          ZIP=out/Salon-${NAME}-ios-device-unsigned.app.zip
          fail() { echo "::error::$1"; exit 1; }
          mkdir -p out
          (cd build/ios/iphoneos && zip -qr "$GITHUB_WORKSPACE/$ZIP" Runner.app) || fail "zip of $ZIP failed"
          unzip -l "$ZIP" > /tmp/ios-package.log 2>&1 || fail "$ZIP is not a readable zip"
          grep -q "Runner.app/Info.plist" /tmp/ios-package.log || fail "$ZIP has no Runner.app/Info.plist"
          grep -q "Runner.app/Runner$" /tmp/ios-package.log || fail "$ZIP has no Runner.app/Runner executable"
          ls -l out/
          echo "::notice::packaged $ZIP $(stat -f %z "$ZIP" 2>/dev/null || stat -c %s "$ZIP")B"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-${{ github.sha }}
          path: out/*.zip
          retention-days: 30

      - name: Report failure reason
        if: failure()
        run: |
          for f in /tmp/ios-device.log /tmp/ios-verify.log /tmp/ios-package.log; do
            if [ -s "$f" ]; then
              echo "::error::$(basename "$f") tail: $(tail -c 900 "$f" | tr '\n' ' ')"
            fi
          done

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/*.log
          retention-days: 7

  release:
    name: Publish GitHub Release with every platform binary
    needs: [build-apk, build-windows, build-linux, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    steps:
      - name: Download every platform binary
        uses: actions/download-artifact@v4
        with:
          pattern: '*-release-*'
          path: release-files
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job never checks out the code, so `gh release` cannot resolve the target
          # repository from a git remote and dies with "failed to run git: fatal: not a git
          # repository". GH_REPO is how gh names the repo outside a checkout; `gh api` calls
          # already pass an explicit repos/ path and are unaffected.
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          DIR=release-files
          fail() { echo "::error::$1"; exit 1; }
          # Each artifact zip keeps the uploader's directory layout (flutter-apk/, deb/, …), so
          # every search below is recursive. All ten names are distinct, so nothing can collide
          # when they are gathered into one list.
          for f in app-release.apk app-arm64-v8a-release.apk app-armeabi-v7a-release.apk \
                   app-x86_64-release.apk app-release.aab; do
            [ -n "$(find "$DIR" -type f -name "$f" -size +1M)" ] || fail "missing android binary: $f"
          done
          for pattern in '*-setup.exe' '*.msi' '*.deb' '*.AppImage' \
                         '*ios-device-unsigned.app.zip'; do
            [ -n "$(find "$DIR" -type f -name "$pattern" -size +1M)" ] || fail "no binary matching $pattern"
          done
          FILES=$(find "$DIR" -type f -size +1M | sort)
          COUNT=$(printf '%s\n' "$FILES" | wc -l)
          echo "Files to publish ($COUNT):"; printf '%s\n' "$FILES"
          [ "$COUNT" -eq 10 ] || fail "expected exactly 10 binaries to publish, found $COUNT"
          NOTES="$(cat <<'EOF'
          Release build of the Salon app for every platform, produced by GitHub Actions.

          ## Android (Flutter, release variant)
          - `app-release.apk` — universal (arm64-v8a, armeabi-v7a, x86_64)
          - `app-arm64-v8a-release.apk` — modern phones
          - `app-armeabi-v7a-release.apk` — older 32-bit phones
          - `app-x86_64-release.apk` — emulators
          - `app-release.aab` — Play Store upload format

          ## Windows (Tauri)
          - `Salon_*_x64-setup.exe` — NSIS installer
          - `Salon_*.msi` — MSI installer

          ## Linux (Tauri)
          - `Salon_*_amd64.deb` — Debian/Ubuntu package
          - `Salon_*_amd64.AppImage` — runs on any x86_64 distro without installing

          ## iOS (Flutter)
          - `Salon-*-ios-device-unsigned.app.zip` — release build for real devices, **unsigned**:
            it has to be re-signed with an Apple Developer certificate before it installs.
            Flutter cannot build a release-variant simulator app, so no simulator bundle ships.
          EOF
          )"
          NOTES="$NOTES

          Built by \`.github/workflows/flutter-build.yml\` on commit \`${{ github.sha }}\`."
          # ghrun: `set -e` would otherwise leave a failed `gh` call with its reason only in the
          # log body, which is unreachable from this machine. The label is short and the reason
          # comes first, because a whole command line (with its notes text) would push gh's own
          # message past the annotation length limit — which is exactly how one publish failure
          # ended up unreadable.
          ghrun() {
            local label="$1"; shift
            local out
            if out=$("$@" 2>&1); then
              printf '[%s] ok\n%s\n' "$label" "$out" >> /tmp/publish.log
              printf '%s\n' "$out"
              return 0
            fi
            printf '[%s] FAILED\n%s\n' "$label" "$out" >> /tmp/publish.log
            printf '::error::%s failed: %s\n' "$label" \
              "$(printf '%s' "$out" | tr '\n\r' '  ' | head -c 700)" >&2
            return 1
          }
          TAG="$GITHUB_REF_NAME"
          # Deleting a tag demotes its release to a draft, and drafts are invisible to
          # `GET /releases` and `releases/tags/<tag>`. Deleting then recreating in one
          # `gh release create` leaves this run's binaries attached to a published release;
          # `gh release delete` without `--cleanup-tag` keeps the tag itself.
          # The existence check goes through raw REST, not `gh release view`: a swallowed
          # `view` failure silently skips the delete, and `create` then dies on
          # "Release already exists" with no trace of why the check missed the release.
          if REL_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id 2>/tmp/view-err.txt); then
            echo "::notice::release for $TAG exists (id=$REL_ID) -> deleting it (tag kept) before recreating"
            ghrun "release delete $TAG" gh release delete "$TAG" --yes
          else
            echo "::notice::no existing release for $TAG: $(tr '\n\r' '  ' < /tmp/view-err.txt | head -c 200)"
          fi
          ghrun "release create $TAG" gh release create "$TAG" --verify-tag \
            --title "Salon $TAG" --notes "$NOTES" $FILES
          # Read through raw REST so the gate checks what an anonymous visitor sees.
          ghrun "release readback $TAG" gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '"\(.draft) \(.assets | length)"' > /tmp/release-state.txt
          STATE=$(cat /tmp/release-state.txt)
          DRAFT=${STATE% *}
          ASSETS=${STATE#* }
          echo "Release $TAG: draft=$DRAFT assets=$ASSETS"
          case "$ASSETS" in ''|*[!0-9]*)
            echo "::error::could not read the asset count of release $TAG (got '$ASSETS')"; exit 1;;
          esac
          if [ "$DRAFT" != "false" ]; then
            echo "::error::release $TAG is not published (draft=$DRAFT) - nothing is downloadable"
            exit 1
          fi
          if [ "$ASSETS" -lt 10 ]; then
            echo "::error::expected 10 release assets across android/windows/linux/ios, got $ASSETS"
            exit 1
          fi
          ghrun "release asset urls $TAG" gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.assets[] | "\(.name)  \(.size) bytes  \(.state)  \(.browser_download_url)"'
          echo "::notice::published $TAG with $ASSETS assets (draft=$DRAFT)"

      - name: Report failure to an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo "## Publish failure (run ${{ github.run_id }}, attempt ${{ github.run_attempt }})"
            echo ""
            echo "Binaries downloaded for this run:"
            find release-files -type f -printf '  %P %s bytes\n' 2>/dev/null || echo "  none"
            echo ""
            echo '```'
            tail -n 60 /tmp/publish.log 2>/dev/null || echo "no publish log written"
            echo '```'
          } > /tmp/failure-report.md
          # The report is diagnostics, never a second failure: an annotation carries the same
          # tail even if issue creation itself breaks.
          echo "::error::publish failed; log tail: $(tail -c 900 /tmp/publish.log 2>/dev/null | tr '\n\r' '  ')"
          gh label create ci-build-failure --color ff6b6b --description "Automated CI build failure report" || true
          gh issue create \
            --title "CI release publish failed: ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}" \
            --label ci-build-failure \
            --body-file /tmp/failure-report.md || echo "::warning::could not file the failure issue"

      # Artifact zips are reachable through the REST API from this machine even when Actions log
      # bodies are not, so the publish log has to leave the runner as an artifact. The name avoids
      # the word `release` so this run's own download step can never pick it up.
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/publish.log
            /tmp/view-err.txt
            /tmp/failure-report.md
          retention-days: 7
