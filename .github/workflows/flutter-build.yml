name: Flutter Build APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
    paths:
      - 'pubspec.yaml'
      - 'lib/**'
      - 'android/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write
  issues: write

jobs:
  build-apk:
    name: Build Flutter Android release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install Android SDK components
        run: |
          set -uo pipefail
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null || true
          # Must match android/app/build.gradle.kts (compileSdk 36, ndkVersion 27.0.12077973)
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          "$SDKMGR" --list_installed | grep -E "platforms;android-36|build-tools;36|ndk;27.0.12077973"

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret -> release APK/AAB stays debug-signed (documented limitation)."
            echo "signed=debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "android.injected.signing.store.file=$RUNNER_TEMP/release.keystore"
            echo "android.injected.signing.store.password=$KEYSTORE_PASSWORD"
            echo "android.injected.signing.key.alias=$KEY_ALIAS"
            echo "android.injected.signing.key.password=$KEY_PASSWORD"
          } >> android/gradle.properties
          echo "signed=release" >> "$GITHUB_OUTPUT"

      - name: Analyze project
        run: flutter analyze 2>&1 | tee /tmp/analyze.log

      - name: Run tests
        run: flutter test 2>&1 | tee /tmp/test.log

      - name: Build universal release APK
        run: flutter build apk --release 2>&1 | tee /tmp/apk-universal.log

      - name: Build per-ABI release APKs
        run: flutter build apk --release --split-per-abi 2>&1 | tee /tmp/apk-split.log

      - name: Build release AAB
        run: flutter build appbundle --release 2>&1 | tee /tmp/aab.log

      - name: Verify artifacts
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          DIR=build/app/outputs/flutter-apk
          "$BT/aapt2" dump badging "$DIR/app-release.apk" | grep -E "^package|^native-code" | tee /tmp/badging.txt
          grep -q "name='com.salon.futsal.futsal_booking_flutter'" /tmp/badging.txt
          grep -q "arm64-v8a" /tmp/badging.txt
          "$BT/apksigner" verify --print-certs "$DIR/app-release.apk"
          # Each split APK must carry exactly one ABI and its own ABI-offset versionCode,
          # otherwise the per-ABI artifacts would be mislabelled copies of the universal one.
          for abi in arm64-v8a armeabi-v7a x86_64; do
            "$BT/aapt2" dump badging "$DIR/app-$abi-release.apk" > "/tmp/badging-$abi.txt"
            grep -q "^native-code: '$abi'\$" "/tmp/badging-$abi.txt"
            test "$(grep -c "^native-code:" "/tmp/badging-$abi.txt")" -eq 1
            grep -q "versionName='1.0.0'" "/tmp/badging-$abi.txt"
            "$BT/apksigner" verify "$DIR/app-$abi-release.apk"
          done
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          unzip -l "$AAB" | grep -E "base/manifest/AndroidManifest.xml|base/dex/classes.dex"
          ls -l "$DIR"/ "$AAB"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK_DIR=build/app/outputs/flutter-apk
          FILES="
          $APK_DIR/app-release.apk
          $APK_DIR/app-arm64-v8a-release.apk
          $APK_DIR/app-armeabi-v7a-release.apk
          $APK_DIR/app-x86_64-release.apk
          build/app/outputs/bundle/release/app-release.aab"
          # A green run with an empty Release is a false success, so fail loudly instead.
          for f in $FILES; do
            if [ ! -s "$f" ]; then echo "::error::missing artifact to publish: $f"; exit 1; fi
          done
          NOTES="$(cat <<'EOF'
          Android build of the Flutter app (release variant).

          - `app-release.apk` — universal (arm64-v8a, armeabi-v7a, x86_64)
          - `app-arm64-v8a-release.apk` — modern phones
          - `app-armeabi-v7a-release.apk` — older 32-bit phones
          - `app-x86_64-release.apk` — emulators
          - `app-release.aab` — Play Store upload format
          EOF
          )"
          NOTES="$NOTES

          Built by \`.github/workflows/flutter-build.yml\` on commit \`${{ github.sha }}\`."
          # Re-runs must not die on "release already exists", and an existing release with
          # zero assets is exactly the false success this step is meant to prevent.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists -> (re)uploading assets"
            gh release upload "$GITHUB_REF_NAME" $FILES --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Salon Futsal Android $GITHUB_REF_NAME" --notes "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "Salon Futsal Android $GITHUB_REF_NAME" --notes "$NOTES" $FILES
          fi
          ASSETS=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets | length')
          echo "Release $GITHUB_REF_NAME published with $ASSETS assets."
          if [ "$ASSETS" -lt 5 ]; then echo "::error::expected 5 release assets, got $ASSETS"; exit 1; fi
          gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[] | "  \(.name)  \(.size/1048576|floor) MiB  \(.browser_download_url)"'

      - name: Report failure to an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Failing step logs (run ${{ github.run_id }}, attempt ${{ github.run_attempt }})"
            for f in /tmp/analyze.log /tmp/test.log /tmp/apk-universal.log /tmp/apk-split.log /tmp/aab.log; do
              if [ -s "$f" ]; then
                echo ""
                echo "### $f"
                echo '```'
                tail -n 120 "$f"
                echo '```'
              fi
            done
          } > /tmp/failure-report.md
          gh label create ci-build-failure --color ff6b6b --description "Automated CI build failure report" || true
          gh issue create \
            --title "CI build failed: ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}" \
            --label ci-build-failure \
            --body-file /tmp/failure-report.md
          echo "Build log tail:"
          tail -n 120 /tmp/apk-universal.log /tmp/apk-split.log /tmp/aab.log || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/*.log
          retention-days: 7
