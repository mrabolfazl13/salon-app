name: Flutter Multi-Platform Build

on:
  push:
    branches: [master]
  tags:
    - 'v*'

jobs:
  build-apk-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      
      - name: Clean build
        working-directory: android_flutter
        run: flutter clean
      
      - name: Get dependencies
        working-directory: android_flutter
        run: |
          flutter pub get || {
            echo "::error::flutter pub get failed"
            exit 1
          }
      
      - name: Build Debug APK
        working-directory: android_flutter
        run: flutter build apk --debug
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android_flutter/build/app/outputs/flutter-apk/app-debug.apk
  
  build-apk-release:
    name: Build Release APK (Signed)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      
      - name: Clean build
        working-directory: android_flutter
        run: flutter clean
      
      - name: Get dependencies
        working-directory: android_flutter
        run: flutter pub get
      
      - name: Setup keystore
        run: |
          # Decode base64-encoded keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android_flutter/release-keystore.jks
          
          # Create key.properties file
          cat > android_flutter/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release-keystore.jks
          EOF
      
      - name: Build Signed Release APK
        working-directory: android_flutter
        run: flutter build apk --release
      
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android_flutter/build/app/outputs/flutter-apk/app-release.apk
  
  build-aab-release:
    name: Build Release AAB (Signed for Play Store)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      
      - name: Clean build
        working-directory: android_flutter
        run: flutter clean
      
      - name: Get dependencies
        working-directory: android_flutter
        run: flutter pub get
      
      - name: Setup keystore
        run: |
          # Decode base64-encoded keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android_flutter/release-keystore.jks
          
          # Create key.properties file
          cat > android_flutter/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release-keystore.jks
          EOF
      
      - name: Build Signed Release AAB
        working-directory: android_flutter
        run: flutter build appbundle --release
      
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: android_flutter/build/app/outputs/bundle/release/app-release.aab
  
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      
      - name: Clean build
        working-directory: android_flutter
        run: flutter clean
      
      - name: Get dependencies
        working-directory: android_flutter
        run: flutter pub get
      
      - name: Build iOS
        working-directory: android_flutter
        run: flutter build ios --release --no-codesign
      
      - name: Create IPA
        working-directory: android_flutter
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r app-release.ipa Payload
      
      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-release.ipa
          path: android_flutter/build/ios/iphoneos/app-release.ipa
