name: Flutter Build APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
    paths:
      - 'pubspec.yaml'
      - 'lib/**'
      - 'android/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write
  issues: write

jobs:
  build-apk:
    name: Build Flutter Android release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install Android SDK components
        run: |
          set -uo pipefail
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null || true
          # Must match android/app/build.gradle.kts (compileSdk 36, ndkVersion 27.0.12077973)
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          "$SDKMGR" --list_installed | grep -E "platforms;android-36|build-tools;36|ndk;27.0.12077973"

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret -> release APK/AAB stays debug-signed (documented limitation)."
            echo "signed=debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "android.injected.signing.store.file=$RUNNER_TEMP/release.keystore"
            echo "android.injected.signing.store.password=$KEYSTORE_PASSWORD"
            echo "android.injected.signing.key.alias=$KEY_ALIAS"
            echo "android.injected.signing.key.password=$KEY_PASSWORD"
          } >> android/gradle.properties
          echo "signed=release" >> "$GITHUB_OUTPUT"

      - name: Analyze project
        run: flutter analyze 2>&1 | tee /tmp/analyze.log

      - name: Run tests
        run: flutter test 2>&1 | tee /tmp/test.log

      - name: Build universal release APK
        run: flutter build apk --release 2>&1 | tee /tmp/apk-universal.log

      - name: Build per-ABI release APKs
        run: flutter build apk --release --split-per-abi 2>&1 | tee /tmp/apk-split.log

      - name: Build release AAB
        run: flutter build appbundle --release 2>&1 | tee /tmp/aab.log

      - name: Verify artifacts
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|^native-code" | tee /tmp/badging.txt
          grep -q "com.salon.futsal.futsal_booking_flutter" /tmp/badging.txt
          "$BT/apksigner" verify --print-certs "$APK"
          ls -l build/app/outputs/flutter-apk/ build/app/outputs/bundle/release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Salon Futsal Android $GITHUB_REF_NAME" \
            --notes "$(cat <<'EOF'
          Android build of the Flutter app (release variant).

          - `app-release.apk` — universal (arm64-v8a, armeabi-v7a, x86_64)
          - `app-arm64-v8a-release.apk` — modern phones
          - `app-armeabi-v7a-release.apk` — older 32-bit phones
          - `app-x86_64-release.apk` — emulators
          - `app-release.aab` — Play Store upload format

          Built by `.github/workflows/flutter-build.yml` on commit `${{ github.sha }}`.
          EOF
          )"

      - name: Report failure to an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Failing step logs (run ${{ github.run_id }}, attempt ${{ github.run_attempt }})"
            for f in /tmp/analyze.log /tmp/test.log /tmp/apk-universal.log /tmp/apk-split.log /tmp/aab.log; do
              if [ -s "$f" ]; then
                echo ""
                echo "### $f"
                echo '```'
                tail -n 120 "$f"
                echo '```'
              fi
            done
          } > /tmp/failure-report.md
          gh label create ci-build-failure --color ff6b6b --description "Automated CI build failure report" || true
          gh issue create \
            --title "CI build failed: ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}" \
            --label ci-build-failure \
            --body-file /tmp/failure-report.md
          echo "Build log tail:"
          tail -n 120 /tmp/apk-universal.log /tmp/apk-split.log /tmp/aab.log || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/*.log
          retention-days: 7
