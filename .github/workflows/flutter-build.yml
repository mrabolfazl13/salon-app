name: Flutter Android Build

on:
  push:
    branches: [master]

jobs:
  build-apk-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      
      - name: Clean build
        working-directory: android_flutter
        run: flutter clean
      
      - name: Get dependencies
        working-directory: android_flutter
        run: |
          flutter pub get || {
            echo "::error::flutter pub get failed"
            exit 1
          }
      
      - name: Build Debug APK
        working-directory: android_flutter
        run: flutter build apk --debug
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android_flutter/build/app/outputs/flutter-apk/app-debug.apk
  
  build-apk-release:
    name: Build Release APK (Unsigned)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      
      - name: Clean build
        working-directory: android_flutter
        run: flutter clean
      
      - name: Get dependencies
        working-directory: android_flutter
        run: flutter pub get
      
      - name: Build Release APK
        working-directory: android_flutter
        run: flutter build apk --release
      
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android_flutter/build/app/outputs/flutter-apk/app-release.apk
  
  build-aab-release:
    name: Build Release AAB (Unsigned)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      
      - name: Clean build
        working-directory: android_flutter
        run: flutter clean
      
      - name: Get dependencies
        working-directory: android_flutter
        run: flutter pub get
      
      - name: Build Release AAB
        working-directory: android_flutter
        run: flutter build appbundle --release
      
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: android_flutter/build/app/outputs/bundle/release/app-release.aab
