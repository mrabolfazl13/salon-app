name: Flutter Android Build

on:
  push:
    branches: [master]

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      
      - name: Get dependencies
        working-directory: android_flutter
        run: |
          flutter pub get || {
            echo "::error::flutter pub get failed"
            exit 1
          }
      
      - name: Clean build
        working-directory: android_flutter
        run: flutter clean
      
      - name: Build APK
        working-directory: android_flutter
        run: flutter build apk --debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android_flutter/build/app/outputs/flutter-apk/app-debug.apk
