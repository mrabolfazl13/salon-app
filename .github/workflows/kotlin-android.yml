name: Kotlin Android (Salon native)

# بیلد اپ کاتلین فقط در CI — بدون بیلد محلی (درخواست صریح)
# خروجی: APK debug در artifact هر push، و APK/AAB امضاشده در release هر tag
on:
  push:
    branches: ["**"]
    tags: ["**"]
    paths:
      - "android-app/**"
      - ".github/workflows/kotlin-android.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "android-app/**"

permissions:
  contents: write

jobs:
  build:
    name: Build & Test (assembleDebug + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (cached, no wrapper binary needed)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android SDK licenses (runner SDK is preinstalled)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          sdkmanager --version || true

      - name: Download Vazirmatn fonts (bundled at build time)
        run: |
          mkdir -p app/src/main/res/font
          base="https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf"
          for w in Regular Medium SemiBold Bold ExtraBold; do
            curl -fsSL "$base/Vazirmatn-$w.ttf" -o "app/src/main/res/font/vazirmatn_$(echo $w | tr 'A-Z' 'a-z').ttf"
          done
          ls -la app/src/main/res/font

      - name: Build + Unit tests + Lint
        run: |
          gradle :app:assembleDebug :core:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Unit test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            android-app/**/build/reports/tests/
            android-app/**/build/reports/lint-results-debug.*

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Salon-Android-debug
          path: android-app/app/build/outputs/apk/debug/*.apk

  release:
    name: Release (signed APK/AAB on tag)
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android SDK licenses (runner SDK is preinstalled)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          sdkmanager --version || true

      - name: Download Vazirmatn fonts
        run: |
          mkdir -p app/src/main/res/font
          base="https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf"
          for w in Regular Medium SemiBold Bold ExtraBold; do
            curl -fsSL "$base/Vazirmatn-$w.ttf" -o "app/src/main/res/font/vazirmatn_$(echo $w | tr 'A-Z' 'a-z').ttf"
          done

      - name: Decode release keystore (secret ANDROID_KEYSTORE_BASE64)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "no keystore secret — release will be unsigned (debug-signing)"
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "ANDROID_KEYSTORE_FILE=$(pwd)/release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build release (signed if keystore present)
        run: |
          gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Salon-Android-release
          path: |
            android-app/app/build/outputs/apk/release/*.apk
            android-app/app/build/outputs/bundle/release/*.aab

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-app/app/build/outputs/apk/release/*.apk
            android-app/app/build/outputs/bundle/release/*.aab
