name: Quality Gates

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  # Backend Tests
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: futsal
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: futsal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
          
      - name: Run migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://futsal:secret@localhost:5432/futsal_test
          REDIS_URL: redis://localhost:6379/0
        run: alembic upgrade head
        
      - name: Run tests with coverage
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://futsal:secret@localhost:5432/futsal_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-key-for-ci
        run: |
          pytest --cov=src --cov-report=xml --cov-report=html
          
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend
          
      - name: Check coverage threshold
        working-directory: ./backend
        run: |
          coverage report --fail-under=80

  # Frontend Tests
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
          
      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile
        
      - name: Type check
        working-directory: ./frontend
        run: pnpm exec tsc --noEmit -p tsconfig.app.json

  # Mobile Tests
  mobile-tests:
    name: Mobile Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          
      - name: Get dependencies
        working-directory: ./android_flutter
        run: flutter pub get
        
      - name: Analyze code
        working-directory: ./android_flutter
        run: flutter analyze

  # Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Backend dependency audit
        working-directory: ./backend
        run: |
          pip install pip-audit bandit
          pip-audit || echo "Vulnerabilities found"
          bandit -r src/ -f json -o bandit-results.json || true
          
      - name: Frontend dependency audit
        working-directory: ./frontend
        run: npm audit --audit-level=moderate || true
        
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: 'http://localhost:8000'
        continue-on-error: true

  # Performance Test
  performance-test:
    name: Performance Test
    runs-on: ubuntu-latest
    needs: [backend-tests]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Locust
        run: pip install locust
        
      - name: Start backend (mock)
        run: |
          # In real scenario, deploy to staging first
          echo "Backend would be running on staging"
          
      - name: Run load test
        working-directory: ./backend
        run: |
          # locust -f locustfile.py --headless -u 50 -r 10 --run-time 2m \
          #   --csv=performance-results || true
          echo "Performance test placeholder"

  # Build Verification
  build-verify:
    name: Build Verification
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Verify frontend build
        working-directory: ./frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          
      - name: Verify mobile build (debug)
        working-directory: ./android_flutter
        run: |
          flutter pub get
          flutter build apk --debug

  # Report Results
  quality-report:
    name: Quality Report
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, mobile-tests, security-scan, build-verify]
    if: always()
    
    steps:
      - name: Check all jobs passed
        run: |
          echo "Backend: ${{ needs.backend-tests.result }}"
          echo "Frontend: ${{ needs.frontend-tests.result }}"
          echo "Mobile: ${{ needs.mobile-tests.result }}"
          echo "Security: ${{ needs.security-scan.result }}"
          echo "Build: ${{ needs.build-verify.result }}"
          
          if [[ "${{ needs.backend-tests.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-tests.result }}" != "success" ]] || \
             [[ "${{ needs.mobile-tests.result }}" != "success" ]]; then
            echo "Quality gates failed!"
            exit 1
          fi
          
          echo "All quality gates passed ✓"
