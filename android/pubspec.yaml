name: salon_app
description: "Salon — futsal venue booking, games, contracts and memberships."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Network
  dio: ^5.7.0
  web_socket_channel: ^3.0.1

  # Storage
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.2

  # Utilities
  intl: ^0.20.2
  shamsi_date: ^1.0.4
  permission_handler: ^11.3.1
  geolocator: ^13.0.2
  file_picker: ^8.1.6
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  flutter_dotenv: ^5.2.1

  # UI
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - .env

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
flutter_launcher_icons:
  image_path: assets/icon.png
  android: launcher_icon
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/icon.png
