version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: futsal_postgres
    environment:
      POSTGRES_USER: futsal
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: futsal_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - futsal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futsal -d futsal_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: futsal_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - futsal_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: futsal_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: futsal-minio-secret
    volumes:
      - minio_data:/data
    networks:
      - futsal_network
    expose:
      - "9000"   # S3 API
      - "9001"   # Console Web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: futsal_backend
    env_file:
      - ./backend/.env   # JWT_SECRET/ADMIN_*/SMTP_* از اینجا (environment پایین‌تر اولویت دارد)
    environment:
      DATABASE_URL: postgresql://futsal:secret@postgres:5432/futsal_db
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,http://tauri.localhost,tauri://localhost"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: futsal-minio-secret
      MINIO_PUBLIC_URL: http://localhost:9000
    volumes:
      - ./backend/app:/app/app
    expose:
      - "8000"
    networks:
      - futsal_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: futsal_celery
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://futsal:secret@postgres:5432/futsal_db
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: futsal-minio-secret
      MINIO_PUBLIC_URL: http://localhost:9000
    volumes:
      - ./backend/app:/app/app
    networks:
      - futsal_network
    depends_on:
      - redis
      - postgres
      - minio
    command: celery -A app.tasks.worker worker --loglevel=info --beat
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: futsal_nginx
    restart: always
    ports:
      - "80:80"      # HTTP
      - "443:443"    # HTTPS (اگر SSL داشته باشید)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/app/static:/app/static:ro  # ← فایل‌های استاتیک واقعی (bind mount)
      - ./ssl:/etc/nginx/ssl:ro       # گواهی‌های SSL (اختیاری)
    depends_on:
      - backend
    networks:
      - futsal_network
networks:
  futsal_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
