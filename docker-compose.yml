version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: futsal_postgres
    environment:
      POSTGRES_USER: futsal
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: futsal_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futsal -d futsal_db"]      
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: futsal_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: futsal_backend
    environment:
      DATABASE_URL: postgresql://futsal:secret@postgres:5432/futsal_db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend/app:/app/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: futsal_celery
    environment:
      DATABASE_URL: postgresql://futsal:secret@postgres:5432/futsal_db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend/app:/app/app
    depends_on:
      - redis
      - postgres
    command: celery -A app.tasks.worker worker --loglevel=info --beat
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
