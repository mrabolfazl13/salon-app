server {
    listen 80;
    server_name salon.absadeghi.ir;

    # Redirect HTTP → HTTPS (except Let's Encrypt ACME challenge)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name salon.absadeghi.ir;

    # SSL certificates (mounted from ./ssl/)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # حداکثر حجم فایل آپلودی
    client_max_body_size 100M;

    # ─── فرانت‌اند SPA (Vite build) ───
    root /usr/share/nginx/html;
    index index.html;

    # فایل‌های استاتیک هش‌دار — کش بلندمدت
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # باقی مسیرها → index.html (مسیریابی سمت کلاینت React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── API بکند ───
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Varzesh3 API (آینه‌سازی پروکسی dev Vite در تولید) ───
    location /api/varzesh3/ {
        proxy_pass https://web-api.varzesh3.com/;
        proxy_set_header Host web-api.varzesh3.com;
        proxy_set_header Origin https://web-api.varzesh3.com;
        proxy_set_header Referer https://web-api.varzesh3.com/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_read_timeout 15s;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Swagger docs / OpenAPI / health
    location ~ ^/(docs|redoc|openapi\.json|health)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # تصاویر MinIO — از طریق HTTPS با مسیر /minio/futsal-venues/
    location /minio/ {
        # Strip /minio prefix and proxy to MinIO
        rewrite ^/minio/(.*) /$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # سرویس فایل‌های استاتیک بکند
    location /static/ {
        alias /app/static/;
        expires 30d;
    }

    # وضعیت سلامت Nginx
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}