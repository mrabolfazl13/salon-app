server {
    listen 80;
    server_name salon.absadeghi.ir;

    # Redirect HTTP → HTTPS (except Let's Encrypt ACME challenge)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name salon.absadeghi.ir;

    # SSL certificates (mounted from ./ssl/)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers — shared snippet so nested add_header blocks keep them too
    include /etc/nginx/snippets/security-headers.conf;

    # حداکثر حجم فایل آپلودی
    client_max_body_size 100M;

    # ─── فرانت‌اند SPA (Vite build) ───
    # /usr/share/nginx/html از ./frontend/dist در docker-compose bind-mount می‌شود
    # (ابتدا `pnpm build` در frontend؛ بدون آن index.html وجود ندارد و همه‌چیز ۴۰۴ می‌شود)
    root /usr/share/nginx/html;
    index index.html;

    # فایل‌های استاتیک هش‌دار — کش بلندمدت
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # صفحهٔ SPA را کش نمی‌کنیم تا نسخهٔ جدید بی‌درنگ دیده شود
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # باقی مسیرها → index.html (مسیریابی سمت کلاینت React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── API بکند ───
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Varzesh3 API (آینه‌سازی پروکسی dev Vite در تولید) ───
    location /api/varzesh3/ {
        proxy_pass https://web-api.varzesh3.com/;
        proxy_set_header Host web-api.varzesh3.com;
        proxy_set_header Origin https://web-api.varzesh3.com;
        proxy_set_header Referer https://web-api.varzesh3.com/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_read_timeout 15s;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # وضعیت سلامت — عمومی (مانیتورینگ/آپ‌تایم پروب‌ها)
    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger/ReDoc/OpenAPI — فقط از شبکه‌های عملیاتی
    # چرا: نقشهٔ کامل API (مسیرها، پارامترها، اسکیماها) را برای مهاجم رایگان می‌دهد.
    # برای دسترسی موقت: IP خود را به allowlist اضافه کن یا از تونل SSH روی سرور استفاده کن.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # تصاویر MinIO — از طریق HTTPS با مسیر /minio/futsal-venues/
    location /minio/ {
        # Strip /minio prefix and proxy to MinIO
        rewrite ^/minio/(.*) /$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # سرویس فایل‌های استاتیک بکند
    location /static/ {
        alias /app/static/;
        expires 30d;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # وضعیت سلامت Nginx
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}