server {
    listen 80;
    server_name _;

    # حداکثر حجم فایل آپلودی
    client_max_body_size 100M;

    # ─── فرانت‌اند SPA (Vite build) ───
    root /usr/share/nginx/html;
    index index.html;

    # فایل‌های استاتیک هش‌دار — کش بلندمدت
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # باقی مسیرها → index.html (مسیریابی سمت کلاینت React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── API بکند ───
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Varzesh3 API (آینه‌سازی پروکسی dev Vite در تولید) ───
    location /api/varzesh3/ {
        proxy_pass https://web-api.varzesh3.com/;
        proxy_set_header Host web-api.varzesh3.com;
        proxy_set_header Origin https://web-api.varzesh3.com;
        proxy_set_header Referer https://web-api.varzesh3.com/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_read_timeout 15s;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Swagger docs / OpenAPI / health
    location ~ ^/(docs|redoc|openapi\.json|health)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # تصاویر MinIO — فقط bucket عمومی از طریق nginx (پورت 9000 بیرون باز نیست)
    location /futsal-venues/ {
        proxy_pass http://minio:9000/futsal-venues/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # سرویس فایل‌های استاتیک بکند
    location /static/ {
        alias /app/static/;
        expires 30d;
    }

    # وضعیت سلامت Nginx
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}