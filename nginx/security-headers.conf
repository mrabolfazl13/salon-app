# هدرهای امنیتی مشترک — با `include` در هر بلوکی که خودش `add_header` دارد تکرار می‌شود
# دلیل: در nginx وجود حتی یک add_header در فرزند، کل هدرهای add_header والد را حذف می‌کند
# (میراث‌پذیری ندارد). `always` هم لازم است تا روی پاسخ‌های ۴xx/۵xx هم اعمال شوند.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# CSP فرانت SPA:
# - script-src 'self': بیلد Vite اسکریپت اینلاین ندارد (index.html فقط ماژول خارجی دارد)
# - style-src 'unsafe-inline': MUI استایل اینلاین تزریق می‌کند، حذف آن UI را می‌شکند
# - font-src 'self': فونت Vazirmatn از @fontsource بسته‌بندی می‌شود (بدون CDN)
# - img-src: کاشی‌های Leaflet/OSM + data:/blob: برای پیش‌نمایش آپلود
# - connect-src: API همان origin است؛ دامنهٔ api.* فقط برای buildهایی با VITE_API_URL مطلق
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://*.absadeghi.ir wss://*.absadeghi.ir; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
