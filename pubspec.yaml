name: futsal_booking_flutter
description: "Futsal Booking System - Premium Sports Energy Mobile App"
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  riverpod: ^2.4.9

  # Networking
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1
  web_socket_channel: ^2.4.0

  # UI Components & Animations
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.9
  animations: ^2.0.11
  lottie: ^3.0.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5

  # Charts & Data Visualization
  fl_chart: ^0.66.0

  # Date & Time
  intl: ^0.20.3
  persian_datetime_picker: ^2.7.0

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Auth & Security
  flutter_secure_storage: ^9.0.0

  # Utils
  url_launcher: ^6.2.2
  package_info_plus: ^9.0.1
  device_info_plus: ^10.0.0
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

